name: Python Tests

# Numerical cross-check suite for the RSSN/FTC/RSF lemma chain: recomputes
# densities, Abel iteration, and entropy bridges in floating point and
# asserts them against the closed forms, including falsification probes.
# Complements the Lean build — it exercises the same claims numerically.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install pytest pytest-timeout

      - name: Run numerical lemma tests
        run: python -m pytest tests/ -q --timeout=120